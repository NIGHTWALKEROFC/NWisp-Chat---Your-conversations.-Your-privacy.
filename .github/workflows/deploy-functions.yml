name: Deploy Supabase Edge Functions

# Runs automatically whenever a function's code changes on main, and can
# also be triggered manually. This is what stops the "function exists in
# the repo but was never deployed" gap (see supabase/SETUP.md) from
# happening again after this first manual fix.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy get-signed-url
        run: supabase functions deploy get-signed-url --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy send-push
        run: supabase functions deploy send-push --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # BUGFIX: this function existed in the repo (and is what the
      # new-login-approval feature actually depends on) but was never
      # added to this deploy list — see supabase/SETUP.md's "still owed"
      # list. Added so it stops silently lagging behind the other two.
      # Feature: NWisp Bots — the app-facing function and the Bot API.
      - name: Deploy nwisp-bot-manage
        run: supabase functions deploy nwisp-bot-manage --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy nwisp-bot-api
        run: supabase functions deploy nwisp-bot-api --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # Feature: voice calls — rings the other phone even when NWisp is closed.
      - name: Deploy send-call-push
        run: supabase functions deploy send-call-push --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # Feature: NWisp Chat Notifications — pushes for new sign-ins, password
      # changes and two-step verification changes.
      - name: Deploy send-security-push
        run: supabase functions deploy send-security-push --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy send-login-approval-push
        run: supabase functions deploy send-login-approval-push --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # --- Feature: custom-branded, non-spam signup/reset email flow ----
      # See EMAIL_SETUP.md. These four share supabase/functions/_shared/,
      # which the Supabase CLI bundles in automatically for each one (the
      # same way it already resolves each function's other relative
      # imports) — nothing extra needed here for that.
      - name: Deploy send-signup-otp
        run: supabase functions deploy send-signup-otp --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy verify-signup-otp
        run: supabase functions deploy verify-signup-otp --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy confirm-verified-email
        run: supabase functions deploy confirm-verified-email --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy send-password-reset
        run: supabase functions deploy send-password-reset --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
