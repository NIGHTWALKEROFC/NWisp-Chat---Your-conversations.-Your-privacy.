name: Deploy Supabase Edge Functions

# Runs automatically whenever a function's code changes on main, and can
# also be triggered manually. This is what stops the "function exists in
# the repo but was never deployed" gap (see supabase/SETUP.md) from
# happening again after this first manual fix.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy get-signed-url
        run: supabase functions deploy get-signed-url --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy send-push
        run: supabase functions deploy send-push --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # BUGFIX: this function existed in the repo (and is what the
      # new-login-approval feature actually depends on) but was never
      # added to this deploy list — see supabase/SETUP.md's "still owed"
      # list. Added so it stops silently lagging behind the other two.
      - name: Deploy send-login-approval-push
        run: supabase functions deploy send-login-approval-push --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
