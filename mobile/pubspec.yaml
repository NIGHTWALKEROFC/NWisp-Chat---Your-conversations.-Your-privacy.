name: secure_chat_app
description: Privacy-focused chat app with 24h Stories
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  supabase_flutter: ^2.6.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  http: ^1.2.2
  libsignal_protocol_dart: ^0.4.0
  url_launcher: ^6.3.1
  cryptography: ^2.7.0
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  flutter_local_notifications: ^18.0.1
  path_provider: ^2.1.4
  flutter_image_compress: ^2.3.0
  video_compress: ^3.1.3
  video_player: ^2.9.2
  chewie: ^1.8.5
  record: ^5.1.2
  just_audio: ^0.9.40

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
