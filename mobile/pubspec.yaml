name: secure_chat_app
description: Privacy-focused chat app with 24h Stories
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  socket_io_client: ^2.0.3+1
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  # Signal Protocol implementation — do the key generation/session logic
  # through this package's API rather than writing custom crypto.
  libsignal_protocol_dart: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
