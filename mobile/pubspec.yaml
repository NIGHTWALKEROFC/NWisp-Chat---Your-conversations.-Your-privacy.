name: secure_chat_app
description: Privacy-focused chat app with 24h Stories
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  supabase_flutter: ^2.6.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  http: ^1.2.2
  crypto: ^3.0.3
  libsignal_protocol_dart: ^0.8.2
  url_launcher: ^6.3.1
  cryptography: ^2.7.0
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  flutter_local_notifications: ^18.0.1
  path_provider: ^2.1.4
  flutter_image_compress: ^2.3.0
  video_compress: ^3.1.3
  video_player: ^2.9.2
  chewie: ^1.8.5
  # Feature: in-app media viewer — save-to-device button in MediaViewerScreen.
  gal: ^2.3.0
  record: ^6.0.0
  just_audio: ^0.9.40
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  # Feature: account data export — hands the exported JSON to the OS share
  # sheet so the person can save/send it wherever they like.
  share_plus: ^10.1.2
  device_info_plus: ^11.1.1
  local_auth: ^2.3.0 # Feature: biometric unlock for the app-wide PIN
  # Feature: unread-count badge on the app icon (see AppBadgeService).
  # Chosen over the older flutter_app_badger because that one has no Android
  # `namespace` and fails to build under the Android Gradle Plugin 8.x this
  # project uses.
  app_badge_plus: ^1.3.5
  # Feature: "Shake to lock" (see ShakeDetector). Reads the accelerometer only
  # while the app is unlocked, in the foreground, and the setting is on.
  sensors_plus: ^5.0.1
  # Feature: Intruder photo (see IntruderPhotoService) — takes a silent
  # front-camera photo after wrong app-lock PINs.
  camera: ^0.11.0
  # Feature: CAPTCHA (Cloudflare Turnstile) on signup + password reset —
  # loads Cloudflare's Turnstile widget inside a small WebView (see
  # TurnstileCaptcha in lib/widgets/turnstile_captcha.dart).
  webview_flutter: ^4.10.0
  # Feature: live location sharing (see LiveLocationService). geolocator
  # reads the device's GPS; flutter_map + latlong2 draw the map bubble/full
  # screen view using OpenStreetMap tiles — no API key or billing account
  # needed, unlike google_maps_flutter.
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# This app is Android-only, but `flutter build` still type-checks the full
# plugin federation for every package it depends on — including
# record_linux, which `record`'s own pubspec constraint resolved to an
# outdated, broken-against-its-own-interface version (record_linux 0.7.2
# vs record_platform_interface 1.6.0), causing a build failure that has
# nothing to do with anything this app actually uses on Android. Pinning
# record_linux here directly is the standard workaround for this class of
# federated-plugin version-skew bug.
dependency_overrides:
  record_linux: ^1.1.0
