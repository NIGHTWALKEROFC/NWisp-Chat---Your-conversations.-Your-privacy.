# Supabase CLI project config.
#
# Run `supabase link --project-ref <your-project-ref>` once from the repo
# root before deploying — that command reads/writes the project_id below.
project_id = "bgbmrtwbndoewwwjxnxa"

# Both Edge Functions verify the caller themselves (a Firebase ID token,
# checked against Google's JWKS — see each function's own index.ts) rather
# than a Supabase Auth session. Supabase's platform-level "Enforce JWT
# Verification" check runs BEFORE the function code and expects a
# Supabase-issued JWT, so it rejects a Firebase token before the function
# ever gets to run its own check. verify_jwt = false here is the CLI/config
# equivalent of turning that dashboard toggle off — declaring it here means
# every future deploy (including from CI) gets it right automatically,
# instead of relying on someone remembering the manual dashboard step.
[functions.get-signed-url]
verify_jwt = false

[functions.send-push]
verify_jwt = false

[functions.send-login-approval-push]
verify_jwt = false

# Feature: voice calls — verifies the caller's Firebase ID token itself.
[functions.send-call-push]
verify_jwt = false

# --- Feature: custom-branded, non-spam signup/reset email flow ----------
# See EMAIL_SETUP.md. send-signup-otp, verify-signup-otp and
# send-password-reset are all public/unauthenticated by design (there's no
# signed-in user yet at signup or "forgot password") — verify_jwt = false
# here just stops Supabase's platform gate rejecting them outright.
# confirm-verified-email DOES check a Firebase ID token itself (same
# reason as get-signed-url above), so it needs verify_jwt = false too.
[functions.send-signup-otp]
verify_jwt = false

[functions.verify-signup-otp]
verify_jwt = false

[functions.confirm-verified-email]
verify_jwt = false

[functions.send-password-reset]
verify_jwt = false

[functions.verify-password-reset-otp]
verify_jwt = false

# Feature: NWisp Bots. The app-facing function checks the person's Firebase
# token itself; the Bot API is called by bots with their own token.
[functions.nwisp-bot-manage]
verify_jwt = false

[functions.nwisp-bot-api]
verify_jwt = false
