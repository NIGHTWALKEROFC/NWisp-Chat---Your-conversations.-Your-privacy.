workflows:
  android-workflow:
    name: Secure Chat - Android
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.nightwalker.securechat"
        SUPABASE_URL: "https://bgbmrtwbndoewwwjxnxa.supabase.co"
        SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJnYm1ydHdibmRvZXd3d2p4bnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODE5OTUsImV4cCI6MjEwMTg1Nzk5NX0.xa0VJg9di1Tm-p6ZmuJSri2kPbsRS1SxoWq4lmJ0CzU"
      android_signing:
        - securechat_keystore
    scripts:
      - name: Get Flutter packages
        script: |
          cd mobile
          flutter packages pub get
      - name: Build APK and AAB
        script: |
          cd mobile
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    artifacts:
      - mobile/build/**/outputs/**/*.aab
      - mobile/build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - saraamuhammad3@gmail.com

  ios-workflow:
    name: Secure Chat - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        SUPABASE_URL: "https://bgbmrtwbndoewwwjxnxa.supabase.co"
        SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJnYm1ydHdibmRvZXd3d2p4bnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODE5OTUsImV4cCI6MjEwMTg1Nzk5NX0.xa0VJg9di1Tm-p6ZmuJSri2kPbsRS1SxoWq4lmJ0CzU"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nightwalker.securechat
    scripts:
      - name: Get Flutter packages
        script: |
          cd mobile
          flutter packages pub get
      - name: Install pods
        script: |
          cd mobile/ios
          pod install
      - name: Build IPA
        script: |
          cd mobile
          flutter build ipa --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - mobile/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - saraamuhammad3@gmail.com
