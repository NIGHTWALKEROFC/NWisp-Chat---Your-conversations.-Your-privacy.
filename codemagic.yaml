workflows:
  android-workflow:
    name: Secure Chat - Android
    max_build_duration: 60
    environment:
      # "default" uses the Flutter version that is already installed on
      # Codemagic's build machine, so nothing big has to be downloaded.
      # ("stable" downloads the newest Flutter on every build, and that
      # download is what kept timing out.) No instance_type line on purpose:
      # the free plan only allows the default Mac machine, and asking for
      # linux_x2 gave "instance type is not available with the current
      # billing plan".
      flutter: default
      # ---- Fixed signing key (so in-app updates can install over the old app) ----
      # Android only installs an update over an existing app if both are signed with
      # the SAME key. Do this ONCE, in this order:
      #   1. Codemagic > Teams > your team > Code signing identities > Android keystores
      #      > "Generate keystore" (or upload your own). Give it the reference name:
      #      nwisp_keystore     — and SAVE the keystore + passwords somewhere safe;
      #      if it is lost you can never publish an update that installs over the app.
      #   2. THEN remove the "#" from the next two lines. (If you remove them before
      #      step 1 the build fails with "keystore not found".)
      # android_signing:
      #   - nwisp_keystore
      vars:
        PACKAGE_NAME: "com.nightwalker.securechat"
        SUPABASE_URL: "https://bgbmrtwbndoewwwjxnxa.supabase.co"
        SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJnYm1ydHdibmRvZXd3d2p4bnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODE5OTUsImV4cCI6MjEwMTg1Nzk5NX0.xa0VJg9di1Tm-p6ZmuJSri2kPbsRS1SxoWq4lmJ0CzU"
        # Cloudflare Turnstile PUBLIC site key (see mobile/lib/widgets/turnstile_captcha.dart).
        # Safe to keep here in plain text — only the SECRET key (kept in
        # Supabase Edge Function secrets, never here) matters for security.
        # Replace with your own site key from the Cloudflare dashboard —
        # until you do, the app falls back to Cloudflare's "always passes"
        # test key, so CAPTCHA is NOT actually protecting anything yet.
        TURNSTILE_SITE_KEY: "0x4AAAAAAFCxWd56M8J50PRe"
        # Relay (TURN) server for "Settings > Calls > Protect IP address in calls".
        #
        # Codemagic does NOT accept empty values here ("" gives the validation
        # error "ensure this value has at least 1 characters"), so while you have
        # no relay server these three lines stay commented out. The build below
        # still works: an undefined variable is simply empty, and the app then
        # shows that switch as "not available".
        #
        # To turn the feature on, remove the "#" and put in REAL values.
        # TURN_URL can list several servers separated by commas, e.g.
        # "turn:host:3478,turns:host:443". These get baked into the APK (the app
        # needs them to place a call), so use credentials made just for this app.
        # If your repo is public and you'd rather not keep them in this file,
        # add them in Codemagic (app > Environment variables, or a variable
        # group referenced with "groups:" under "environment:") instead.
        # TURN_URL: "turn:your-relay-host:3478"
        # TURN_USER: "your-username"
        # TURN_PASS: "your-password"
        #
        # Update guard "copy check" (optional). Leave it OUT until you build with
        # your own fixed signing key. Then add EXPECTED_CERT_SHA256 in Codemagic
        # (app > Environment variables) with the fingerprint shown in the app at
        # Settings > App updates > "App signature". An undefined variable is
        # simply empty, which switches the check off.
    scripts:
      - name: Get Flutter packages
        script: |
          cd mobile
          flutter packages pub get
      - name: Build APK
        script: |
          cd mobile
          # Size reduction (no app changes):
          #  --split-per-abi   one APK per CPU type instead of one fat APK
          #                    holding all three. Install the arm64-v8a one
          #                    on nearly every phone made since ~2017.
          #  --obfuscate +     shortens Dart names and moves debug symbols
          #  --split-debug-info out of the APK into build/symbols.
          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY \
            "--dart-define=TURN_URL=$TURN_URL" \
            "--dart-define=TURN_USER=$TURN_USER" \
            "--dart-define=TURN_PASS=$TURN_PASS" \
            "--dart-define=EXPECTED_CERT_SHA256=$EXPECTED_CERT_SHA256"
    artifacts:
      - mobile/build/**/outputs/**/*.apk
      # Keep these: they let you read crash stack traces from obfuscated builds.
      - mobile/build/symbols/**
    publishing:
      email:
        recipients:
          - saraamuhammad3@gmail.com
