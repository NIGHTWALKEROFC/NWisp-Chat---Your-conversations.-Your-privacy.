workflows:
  android-workflow:
    name: Secure Chat - Android
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.nightwalker.securechat"
      android_signing:
        - securechat_keystore
    scripts:
      - name: Get Flutter packages
        script: |
          cd mobile
          flutter packages pub get
      - name: Build APK and AAB
        script: |
          cd mobile
          flutter build appbundle --release
    artifacts:
      - mobile/build/**/outputs/**/*.aab
      - mobile/build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com

  ios-workflow:
    name: Secure Chat - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nightwalker.securechat
    scripts:
      - name: Get Flutter packages
        script: |
          cd mobile
          flutter packages pub get
      - name: Install pods
        script: |
          cd mobile/ios
          pod install
      - name: Build IPA
        script: |
          cd mobile
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - mobile/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your-email@example.com
